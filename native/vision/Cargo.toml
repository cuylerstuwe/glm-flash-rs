[package]
name = "alaska-vision-loader-probe"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "alaska-vision-loader-probe"
path = "weights_probe.rs"

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
