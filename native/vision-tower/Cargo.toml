[package]
name = "alaska-vision-tower-probe"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "alaska-vision-tower-probe"
path = "probe.rs"

[dependencies]
anyhow = "=1.0.104"
blake2 = "=0.10.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
ryu = "=1.0.23"
libloading = "=0.8.9"
