[package]
name = "alaska-vision-decode-probe"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "alaska-vision-decode-probe"
path = "decode_probe.rs"

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
blake2 = "=0.10.6"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
libc = "=0.2.190"
libloading = "=0.8.9"
png = "=0.18.1"
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
ryu = "=1.0.23"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
idna = "=1.1.0"

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
